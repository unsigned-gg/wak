{{- if .Values.pullSecret.create }}
# Registry pull credentials, ESO-materialized from the configured secret
# store into secret `harbor-pull` (the name referenced by
# .Values.imagePullSecrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: waker-harbor-pull
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "waker.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.pullSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.pullSecret.remoteKey }}
        property: {{ .Values.pullSecret.property }}
{{- end }}
