apiVersion: v1
kind: Service
metadata:
  name: waker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "waker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "waker.selectorLabels" . | nindent 4 }}
  ports:
    - name: health
      port: 8080
      targetPort: health
    {{- if .Values.targets }}
    {{- range .Values.targets }}
    - name: t-{{ .name }}
      port: {{ .listenPort }}
      targetPort: t-{{ .name }}
    {{- end }}
    {{- end }}
